[project]
name = "synqit-jac"
version = "0.1.0"
description = "Synqit in Jac: the codebase as a graph, escalation as a walk over it"
entry-point = "main.jac"
kind = "fullstack"

# Pinned to exactly what the Dockerfile installs. jac-scale is what turns
# `jac start` from bare walker RPC into a service: @restspec routes (which is
# what notchsocket.jac's WebSocket is built on), Swagger at /docs, /healthz
# probes, the /graph visualizer, the admin portal, and webhooks.
#
# jaclang is deliberately NOT listed here. It is the host runtime, not a
# project dependency: a managed host supplies its own, and asking to install a
# second one fails the whole dependency step -- which takes byllm down with it
# and leaves `import from byllm.llm` unresolvable. The Dockerfile installs
# jaclang==0.16.7 because there it *is* the host.
[dependencies]
# jac-client is what compiles components/*.cl.jac into the served bundle.
# Without it the project is headless and `/` has no page.
jac-client = "==0.3.25"
byllm = "==0.6.19"
jac-scale = "==0.2.31"
requests = ">=2.31.0"

[plugins.scale.server]
suppress_health_check_logs = true

# Serve the client at `/` instead of `/cl/app`, so the deployed URL opens the
# board rather than the JSON API index. The API keeps its own prefixes
# (`walker/`, `function/`, `user/`, `static/`).
[serve]
base_route_app = "app"

# What Vite builds components/Board.cl.jac against. Without this block the
# bundle does not build and `/` answers 503 while every REST endpoint keeps
# working -- a headless server that looks healthy. Versions are the fullstack
# scaffold's own defaults.
[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
zod = "^4.3.6"
"@hookform/resolvers" = "^5.2.2"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"
